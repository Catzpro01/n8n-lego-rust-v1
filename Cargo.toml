[workspace]
resolver = "2"
members = [
    "crates/n8n-common",
    "crates/n8n-workflow",
    "crates/n8n-connection",
    "crates/n8n-validation",
    "crates/n8n-node-model",
    "crates/n8n-execution-data",
    "crates/n8n-expression",
    "crates/n8n-nodes-rust",
    "crates/n8n-realtime",
    "crates/n8n-lego",
]
exclude = [
    "apps/n8n-rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["n8n-rust team"]
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
petgraph = "0.6"
indexmap = { version = "=2.2.6", features = ["serde"] }

[profile.dev]
debug = 1

[profile.test]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.test.package."*"]
opt-level = 2

# LEGO V2 facade is the beginner-friendly public composition point.

[package]
name = "n8n-port-contract"
version = "0.1.0"
edition = "2021"
authors = ["n8n-rust team"]
license = "Apache-2.0"
description = "Canonical Port Contract, Lifecycle, Security, and Data Plane primitives for LEGO Architecture"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { version = "1.0", features = ["sync", "time", "macros", "rt"] }
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }

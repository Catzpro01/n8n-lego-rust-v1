[package]
name = "n8n_rust_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
napi-binding = ["dep:napi", "dep:napi-derive"]

[dependencies]
sha2 = "0.10"
base64 = "0.22"
regex = "1.10"

tokio = { version = "1.53.2", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
petgraph = "0.8.3"
reqwest = { version = "0.13.5", features = ["json"] }
boa_engine = "0.22.0"
napi = { version = "2.16.4", default-features = false, features = ["napi4", "tokio_rt", "async"], optional = true }
napi-derive = { version = "2.16.4", optional = true }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "postgres"] }
tokio-cron-scheduler = "0.15.1"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
mime_guess = "2.0.5"
urlencoding = "2.1.3"

# --- RUST COMPILE SPEED OPTIMIZATION ---

[profile.dev]
opt-level = 0
debug = 0 
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1
debug = false

[build-dependencies]
napi-build = "2.1.3"

name: TypeScript Runtime Gate

# Phase TS-1: gates the TypeScript baseline (apps/n8n-ts + packages/reconstructed-engine
# + tests/runtime). Rust is untouched by this workflow and keeps its own pipelines.
#
# Runs on Windows self-hosted runners using explicit Docker container (n8n-node-ci:latest).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/n8n-ts/**'
      - 'packages/reconstructed-engine/**'
      - 'tests/runtime/**'
      - 'tests/fixtures/runtime/**'
      - 'tests/integration/runtime_*'
      - 'scripts/install.sh'
      - 'scripts/start.sh'
      - 'scripts/stop.sh'
      - 'scripts/upgrade.sh'
      - 'scripts/rollback.sh'
      - 'scripts/doctor.sh'
      - 'scripts/lib/common.sh'
      - 'deploy/docker/**'
      - 'contracts/runtime-api.contract.md'
      - '.github/workflows/typescript-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'apps/n8n-ts/**'
      - 'packages/reconstructed-engine/**'
      - 'tests/runtime/**'
      - 'tests/fixtures/runtime/**'
      - 'tests/integration/runtime_*'
      - 'scripts/install.sh'
      - 'scripts/start.sh'
      - 'scripts/stop.sh'
      - 'scripts/upgrade.sh'
      - 'scripts/rollback.sh'
      - 'scripts/doctor.sh'
      - 'scripts/lib/common.sh'
      - 'deploy/docker/**'
      - 'contracts/runtime-api.contract.md'
      - '.github/workflows/typescript-runtime.yml'
  workflow_dispatch:

concurrency:
  group: typescript-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Runtime gate (typecheck + unit + real-process suite + single-engine audit)
    runs-on: [self-hosted, Windows, X64, rust-build, n8n-rust]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Execute Runtime Gate in Linux Container
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\ci\run-linux-container.ps1" -Image n8n-node-ci:latest -Command @'
          set -euo pipefail
          mkdir -p /tmp/runner-temp
          export RUNNER_TEMP=/tmp/runner-temp

          # /workspace is a bind mount of a Windows path (Docker Desktop file
          # sharing), so every file open crosses a translation layer that is far
          # slower than the container's own disk. This gate spawns ~80 real
          # runtime processes and each one re-resolves the whole import graph:
          # on HEAD 0a05762a a spawn took 19-22 s on the mount, against the
          # harness 20 s startup timeout, while the same spawn on a local
          # filesystem is under 0.5 s — 55 of 79 stage-4 tests died on that gap.
          # Copy the tree once onto container-local disk and run the gate there.
          # `reference/` (the pinned n8n checkout) and `.git` are not read by
          # this job, so they stay out of the copy.
          ws=/tmp/arena-workspace
          rm -rf "$ws"
          mkdir -p "$ws"
          started=$(date +%s)
          ( cd /workspace && tar cf - --exclude=./reference --exclude=./.git . ) | ( cd "$ws" && tar xf - )
          echo "[runner] workspace copied to $ws in $(( $(date +%s) - started ))s"

          # Failure logs are written inside the copy, but the upload step reads
          # them from the host workspace: copy them back whatever the outcome.
          trap 'mkdir -p /workspace/logs && cp -a "$ws"/logs/. /workspace/logs/ 2>/dev/null || true' EXIT

          export GITHUB_WORKSPACE="$ws"
          cd "$ws"
          sed -i 's/\r$//' tests/integration/runtime_gate.sh scripts/lib/common.sh scripts/*.sh
          node -v
          npm --prefix apps/n8n-ts ci --no-audit --no-fund
          bash tests/integration/runtime_gate.sh
          node tests/runtime/helpers/update-fixtures.mjs --check
          bash -n scripts/lib/common.sh
          for script in scripts/install.sh scripts/start.sh scripts/stop.sh scripts/upgrade.sh scripts/rollback.sh scripts/doctor.sh; do
            bash -n "$script"
            bash "$script" --help >/dev/null
          done
          '@

      # Already failure-only, so low volume; shortened and made non-fatal for the same
      # reason as the uploads in n8n-lego.yml (org artifact quota exhausted 2026-09-29).
      - name: Upload runtime logs on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: runtime-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 3

  contract:
    name: Rust workspace untouched by this change set
    runs-on: [self-hosted, Windows, X64, rust-build, n8n-rust]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Native PowerShell: the contract check is a pure git-diff assertion that
      # does not need a Linux container.  Eliminating the Docker startup saves
      # ~30-60 s per run without changing the checked paths or the error output.
      - name: Assert the TypeScript change set does not touch Rust or the reference source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $baseSha = "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"
          $changed = git diff --name-only $baseSha HEAD 2>$null
          if ($LASTEXITCODE -ne 0) { $changed = git diff --name-only HEAD~1 HEAD }
          Write-Host $changed
          $forbidden = $changed | Where-Object { $_ -match '^(crates/|apps/n8n-rust/|Cargo\.(toml|lock)|reference/n8n/)' }
          if ($forbidden) {
            Write-Host "::error::Phase TS-1 must not modify Rust crates, the Rust app or the pinned reference"
            Write-Host "Forbidden changes:"
            $forbidden | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "Contract check passed: no Rust or reference paths touched"

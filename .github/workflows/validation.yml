name: Level 0 & Level 1 Validation (Linux Docker)

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.arena/logs/**'
      - '.gitignore'
  push:
    branches:
      - 'runtime-kernel/*'
      - 'execution-engine/*'
      - 'data-plane/*'
      - 'node-system/*'
      - 'expression-engine/*'
      - 'workflow-compatibility/*'
      - 'verification/*'
      - 'performance/*'
      - 'security-sandbox/*'
      - 'infrastructure-orchestration/*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.arena/logs/**'
      - '.gitignore'

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation:
    name: Level 0 & 1 (Linux Docker)
    runs-on: [ self-hosted, Windows, X64, rust-build, n8n-rust ]
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Level 0 - Format & Check + Level 1 - Full Workspace Tests
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\ci\run-linux-container.ps1" -Command @'
          set -euo pipefail

          command -v cargo
          command -v rustc
          command -v rustfmt
          cargo --version
          rustc --version
          rustfmt --version

          echo "=== Level 0: format ==="
          cargo fmt --all -- --check

          echo "=== Level 0: check ==="
          cargo check --workspace

          echo "=== Level 1: full workspace tests ==="
          cargo test --workspace
          '@

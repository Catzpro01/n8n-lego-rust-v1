name: Post-Merge Verification & Resource Cleanup

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]

# Deleting the PR head branch needs write access to refs; deleting that PR's
# workflow artifacts needs write access to actions. Nothing else.
permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    name: Post-Merge Verification & Branch Cleanup
    runs-on: [ self-hosted, Windows, X64, rust-build, n8n-rust ]
    concurrency:
      # Serialize this heavyweight self-hosted lane across every PR and workflow.
      # The workflow-level group above only deduplicates pushes to the SAME ref, so
      # N open PRs still run N Docker lanes at once on one shared Windows host.
      # Measured 2026-09-30 08:38: three PR heads pushed within seconds produced 9
      # concurrent runs; the jobs that shared the host sat at ~10.03 min (normal:
      # 3.4-3.9 min) and failed, while the identical retry on an idle fleet passed
      # in 0.65-4.9 min. cancel-in-progress stays false so queued evidence survives.
      #
      # Split 2026-09-30 (owner decision on #405): check and test carry SEPARATE
      # groups, so Level 0 & 1 and Level 2 run in parallel for one PR while every
      # other PR queues behind whichever lane it needs. Ceiling on the shared host
      # becomes at most two heavy lanes at a time, never the 4-6 that a burst of PR
      # pushes used to start.
      # Post-merge verification shares the test lane on purpose: it must not race a
      # PR's integration run for the same host.
      group: arena-selfhosted-rust-test
      cancel-in-progress: false
    if: github.event.pull_request.merged == true
    timeout-minutes: 15
    steps:
      # Full history: when another PR merged in the meantime, main has advanced past
      # merge_commit_sha and a depth-1 checkout no longer contains it. The runner also
      # fetches the SHA explicitly / deepens on its own, so a shallow checkout would
      # still work, but a complete history keeps the ancestry check conclusive.
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Post-Merge Main Verification (Linux container)
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\ci\run-linux-container.ps1" -Command @'
          set -euo pipefail
          cargo check --workspace --locked
          cargo test -p n8n-workflow --locked
          '@

      # The runner verifies that merge_commit_sha is on main (fetching it if main moved on),
      # never deletes main or arena-manager (DEC-0019), and
      # exits 0 with a clear message when the head branch is already gone.
      # --skip-tests: the step above already ran the same cargo commands on this checkout.
      - name: Execute Cleanup & Delete Task Branch
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $python = Get-Command py.exe -ErrorAction SilentlyContinue
          if ($python) {
            & $python.Source -3 tools/orchestration/cleanup_runner.py --branch "$env:BRANCH_NAME" --merge-sha "$env:MERGE_SHA" --pr "$env:PR_NUMBER" --skip-tests
          } else {
            & python tools/orchestration/cleanup_runner.py --branch "$env:BRANCH_NAME" --merge-sha "$env:MERGE_SHA" --pr "$env:PR_NUMBER" --skip-tests
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The merged PR's artifacts have finished their job: they existed to prove the
      # PR was green, and the merge is that proof. Left alone they accumulate against
      # the org quota, which on 2026-09-29 was exhausted (1681 live artifacts,
      # 8.07 GB, 0 expired) and turned three green jobs red - blocking every merge
      # under DEC-0015 while every test step in them had passed.
      #
      # Selection is by exact commit SHA (the PR head and the merge commit), never by
      # branch name or artifact-name pattern, so this cannot sweep anything unrelated.
      # Non-fatal on purpose: post-merge verification and branch cleanup above are the
      # steps that matter, and a storage problem must never block them again.
      - name: Delete the merged PR workflow artifacts
        if: always()
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $python = Get-Command py.exe -ErrorAction SilentlyContinue
          if ($python) {
            & $python.Source -3 tools/orchestration/cleanup_artifacts.py --sha "$env:HEAD_SHA" --sha "$env:MERGE_SHA" --pr "$env:PR_NUMBER" --apply
          } else {
            & python tools/orchestration/cleanup_artifacts.py --sha "$env:HEAD_SHA" --sha "$env:MERGE_SHA" --pr "$env:PR_NUMBER" --apply
          }

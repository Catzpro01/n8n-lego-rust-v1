name: Level 2 Integration & Conformance Suite (Matrix Workers)

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.arena/logs/**'
      - '.gitignore'

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PR refs only; every push to a protected branch keeps its own run (merge evidence).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration_workspace:
    name: Level 2 Workspace Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ linux, windows ]
    runs-on: [ self-hosted, '${{ matrix.os }}', x64, rust-build, n8n-rust ]
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      # Self-heal (Linux workers only): a restarted WSL runner must not turn the
      # workspace test run into "cargo: command not found" (exit 127). The Windows
      # worker keeps its own cargo environment.
      - name: Level 2 - Rust toolchain preflight
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          if ! command -v cargo >/dev/null 2>&1; then
            echo "cargo not found on PATH - installing rustup (minimal + rustfmt)"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component rustfmt
            . "$HOME/.cargo/env"
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "cargo: $(command -v cargo) ($(cargo --version))"
          rustc --version

      - name: Level 2 - Full Rust Workspace Tests
        run: cargo test --workspace

  conformance:
    name: Level 2 Conformance LEGO & Node Catalog
    runs-on: [ self-hosted, linux, x64, rust-build, n8n-rust ]
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Level 2 - Localization & Catalog Tests
        run: node --test packages/reconstructed-engine/localization.test.mjs packages/reconstructed-engine/node-catalog.test.mjs

      - name: Level 2 - Execution LEGO Conformance Tests
        run: node --experimental-strip-types --test packages/execution-lego/test/02-runtime.test.mjs packages/execution-lego/test/03-context-recovery.test.mjs

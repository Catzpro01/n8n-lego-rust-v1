name: Level 2 Integration & Conformance Suite (Linux Docker)

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.arena/logs/**'
      - '.gitignore'

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    name: Level 2 (Linux Docker)
    runs-on: [ self-hosted, Windows, X64, rust-build, n8n-rust ]
    concurrency:
      # Serialize this heavyweight self-hosted lane across every PR and workflow.
      # The workflow-level group above only deduplicates pushes to the SAME ref, so
      # N open PRs still run N Docker lanes at once on one shared Windows host.
      # Measured 2026-09-30 08:38: three PR heads pushed within seconds produced 9
      # concurrent runs; the jobs that shared the host sat at ~10.03 min (normal:
      # 3.4-3.9 min) and failed, while the identical retry on an idle fleet passed
      # in 0.65-4.9 min. cancel-in-progress stays false so queued evidence survives.
      #
      # Split 2026-09-30 (owner decision on #405): check and test carry SEPARATE
      # groups, so Level 0 & 1 and Level 2 run in parallel for one PR while every
      # other PR queues behind whichever lane it needs. Ceiling on the shared host
      # becomes at most two heavy lanes at a time, never the 4-6 that a burst of PR
      # pushes used to start.
      group: arena-selfhosted-rust-test
      cancel-in-progress: false
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Level 2 - Full Workspace + LEGO & Node Conformance
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\ci\run-linux-container.ps1" -Command @'
          set -euo pipefail

          command -v cargo
          command -v rustc
          command -v node
          cargo --version
          rustc --version
          node --version

          echo "=== Level 2: full Rust workspace tests ==="
          cargo test --workspace --locked

          echo "=== Level 2: Localization & Node Catalog ==="
          node --test packages/reconstructed-engine/localization.test.mjs packages/reconstructed-engine/node-catalog.test.mjs

          echo "=== Level 2: Execution LEGO ==="
          node --experimental-strip-types --test packages/execution-lego/test/02-runtime.test.mjs packages/execution-lego/test/03-context-recovery.test.mjs
          '@

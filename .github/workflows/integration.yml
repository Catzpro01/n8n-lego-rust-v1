name: Level 2 Integration & Conformance Suite (Linux Docker)

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.arena/logs/**'
      - '.gitignore'

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    name: Level 2 (Linux Docker)
    runs-on: [ self-hosted, Windows, X64, rust-build, n8n-rust ]
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Level 2 - Full Workspace + LEGO & Node Conformance
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\ci\run-linux-container.ps1" -Command @'
          set -euo pipefail

          command -v cargo
          command -v rustc
          command -v node
          cargo --version
          rustc --version
          node --version

          echo "=== Level 2: full Rust workspace tests ==="
          cargo test --workspace --locked

          echo "=== Level 2: Localization & Node Catalog ==="
          node --test packages/reconstructed-engine/localization.test.mjs packages/reconstructed-engine/node-catalog.test.mjs

          echo "=== Level 2: Execution LEGO ==="
          node --experimental-strip-types --test packages/execution-lego/test/02-runtime.test.mjs packages/execution-lego/test/03-context-recovery.test.mjs
          '@

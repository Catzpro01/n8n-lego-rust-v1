# Machine-readable Sub-LEGO ownership, execution model and runtime placement registry
# Port contracts are authoritative in each Sub-LEGO CONTRACT.md.
# runtime_host is a hosting recommendation, not a process-per-sublego requirement.

version: 1
planning_model: lego-sublego-work-item
path_root: lego

rules:
  primary_work_item_identity: "sublego:Lxx.Syy"
  one_file_one_sublego: true
  one_sublego_one_capability: true
  cross_sublego_private_imports: false
  cyclic_sublego_dependencies: false
  shared_behavior_in_contracts: false

